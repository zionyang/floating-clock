<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>悬浮时钟</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="clockShell" class="clock-shell">
      <header class="titlebar" data-tauri-drag-region="deep">
        <button id="miniModeButton" class="titlebar-action" type="button" title="进入 Mini 模式" aria-label="进入 Mini 模式" data-tauri-drag-region="false">
          <svg class="lucide-icon window-mode-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M7 12h10" />
          </svg>
        </button>
        <span class="title-name">悬浮时钟</span>
        <div class="window-actions" data-tauri-drag-region="false">
          <button id="topmostButton" class="titlebar-action" type="button" title="取消窗口置顶" aria-label="取消窗口置顶">
            <svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6Z" />
              <path d="M12 14v7" />
            </svg>
          </button>
          <button id="minimizeButton" class="titlebar-action" type="button" title="隐藏到托盘" aria-label="隐藏到托盘">
            <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button id="closeButton" class="titlebar-action" type="button" title="退出程序" aria-label="退出程序">&times;</button>
        </div>
      </header>

      <section class="source-row">
        <div class="source-picker">
          <span>时间源</span>
          <details id="sourceMenu" class="source-menu">
            <summary id="sourceSelect" class="source-select" aria-label="时间源">
              <span id="sourceSelectValue">加载时间源…</span>
            </summary>
            <div id="sourceOptions" class="source-options"></div>
          </details>
        </div>
        <button id="syncButton" class="icon-button" type="button" title="重新校准" aria-label="重新校准">
          &#8635;
        </button>
      </section>

      <section class="mode-switch" role="tablist" aria-label="显示模式">
        <button id="clockModeButton" class="active" type="button" role="tab" aria-selected="true">时钟</button>
        <button id="countdownModeButton" type="button" role="tab" aria-selected="false">倒计时</button>
      </section>

      <section id="clockPanel" class="time-panel">
        <div class="time-value-wrapper">
          <button id="clockValue" class="time-value time-value-toggle" type="button" aria-describedby="clockPrecisionTooltip" aria-label="显示整秒">--:--:--</button>
          <span id="clockPrecisionTooltip" class="time-precision-tooltip" role="tooltip">显示整秒</span>
        </div>
        <p class="time-subvalue" id="dateValue">等待校准</p>
      </section>

      <section id="countdownPanel" class="time-panel countdown-panel" hidden>
        <div class="time-value-wrapper">
          <button id="countdownValue" class="time-value time-value-toggle countdown-value" type="button" aria-describedby="countdownPrecisionTooltip" aria-label="显示整秒">00:00:00.000</button>
          <span id="countdownPrecisionTooltip" class="time-precision-tooltip" role="tooltip">显示整秒</span>
        </div>
        <label class="target-row">
          <span>目标北京时间</span>
          <input id="targetInput" type="datetime-local" step="0.001" />
        </label>
        <div class="quick-targets" aria-label="快捷倒计时目标">
          <button type="button" data-quick-target="next-hour">下一整点</button>
          <button type="button" data-quick-target="10:00">10:00</button>
          <button type="button" data-quick-target="20:00">20:00</button>
        </div>
        <div class="countdown-actions">
          <button id="startCountdownButton" type="button">开始</button>
          <button id="stopCountdownButton" type="button">停止</button>
        </div>
      </section>

      <footer class="statusbar">
        <p id="syncStatus">准备校准</p>
        <p id="offsetStatus">本机偏移 --</p>
      </footer>

      <section class="mini-panel" aria-label="Mini 模式时间">
        <p id="miniSource" class="mini-source">加载时间源…</p>
        <p id="miniValue" class="mini-value">--:--:--.---</p>
        <p id="miniDate" class="mini-date">等待校准</p>
      </section>
      <div class="mini-actions" data-tauri-drag-region="false">
        <button id="miniCloseButton" class="mini-action" type="button" title="退出程序" aria-label="退出程序">
          <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m7 7 10 10" />
            <path d="m17 7-10 10" />
          </svg>
        </button>
        <button id="miniRestoreButton" class="mini-action" type="button" title="恢复标准模式" aria-label="恢复标准模式">
          <svg class="lucide-icon window-mode-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="5" y="5" width="14" height="14" rx="1" />
          </svg>
        </button>
        <button id="miniMinimizeButton" class="mini-action" type="button" title="隐藏到托盘" aria-label="隐藏到托盘">
          <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 12h14" />
          </svg>
        </button>
      </div>
    </main>
    <script src="../countdown-core.js"></script>
    <script src="../time-core.js"></script>
    <script src="../time-sources.js"></script>
    <script src="../tauri-bridge.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
